name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bramlybar/bramly-sample-nodejs

jobs:
  security-sast:
    name: Security Checks (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SAST (Static Application Security Testing)
      - name: Run njsscan (OWASP Node.js SAST)
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --exit-warning'

      # Bonus Security Check: Secret Scanning
      - name: Run TruffleHog Secret Scanner (Bonus)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  # Using GitHub automatically generated temporary secret called secrets.GITHUB_TOKEN needs the permissions part
  build-and-scan:
    name: Build & Scan Docker Image
    needs: security-sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Version Bumping (Git Workflow)
      - name: Extract Docker Metadata (Version Bumping)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      # Build the Docker image locally so it can be scanned
      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Vulnerability Scanning (Docker Image)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'             # Fails the job if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'  # Blocks on HIGH and CRITICAL

      # Upload the Trivy scan report as an artifact to review results
      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt


      # Push image to private registry (GHCR), only if security scans pass and this is a merge/push
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the container image with the immutable commit SHA tag
      - name: Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # GitOps Deployment (Update GitOps Repository)
  update-gitops-repo:
    name: Trigger ArgoCD GitOps Deployment
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      # Checkout the dedicated GitOps repository using PAT
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: 'BramlyBar/bramly-sample-nodejs-gitops'
          token: ${{ secrets.GITOPS_PAT }}
          path: 'gitops'

      # Bump the image tag in values.yaml to the newly pushed commit SHA
      - name: Update Helm Image Tag
        run: |
          cd gitops
          # Update the image tag in values.yaml to trigger ArgoCD sync
          sed -i 's/tag: .*/tag: "sha-${{ github.sha }}"/' chart/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "cd: Update image tag to sha-${{ github.sha }} [skip ci]"
          git push origin main
