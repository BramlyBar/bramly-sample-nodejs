name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bramlybar/bramly-sample-nodejs

jobs:
  security-sast:
    name: Security Checks (SAST & Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SAST (Static Application Security Testing)
      - name: Run njsscan (OWASP Node.js SAST)
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --exit-warning'

      # Bonus Security Check: Secret Scanning
      - name: Run TruffleHog Secret Scanner (Bonus)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  build-and-scan:
    name: Build & Scan Docker Image
    needs: security-sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Version Bumping (Git Workflow)
      - name: Extract Docker Metadata (Version Bumping)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      # Build the Docker image locally so it can be scanned
      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Vulnerability Scanning (Docker Image)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'             # Fails the job if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'  # Blocks on HIGH and CRITICAL

      # Upload the Trivy scan report as an artifact to review results
      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: trivy-results.txt
