# ClusterIP provides a stable internal IP and cluster-internal DNS name so other pods or Ingress can reach the application without tracking changing pod IPs.
apiVersion: v1
kind: Service
metadata:
  name: bramly-sample-nodejs
  labels:
    app: bramly-sample-nodejs
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: bramly-sample-nodejs
