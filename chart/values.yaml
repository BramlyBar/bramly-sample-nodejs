replicaCount: 1

image:
  repository: ghcr.io/bramlybar/bramly-sample-nodejs
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  host: bramly-sample-nodejs.local
  path: /

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  PORT: "8080"
